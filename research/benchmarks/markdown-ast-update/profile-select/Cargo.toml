[package]
name = "markit-mdbench-profile-select"
version.workspace = true
edition.workspace = true
license.workspace = true

# CORRECTIVE-B (#35): mechanism-neutral profiling of the frozen PR #34
# candidate universe and deterministic selection of the four logical
# workload sets. This crate consumes ONLY acquisition manifests,
# materialized source bytes, CORRECTIVE-A profiler outputs, the committed
# domain mapping and the frozen selection configuration. It has no
# dependency on mechanisms/*, instrumentation or runner, and no timing,
# allocation, reuse or horse fact is reachable from it.

[dependencies]
markit-mdbench-semantics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[lib]
name = "markit_mdbench_profile_select"

[[bin]]
name = "mdbench-corrective-b"
path = "src/bin/mdbench-corrective-b.rs"
