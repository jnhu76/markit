[workspace]
resolver = "2"
members = [
    "common",
    "instrumentation",
    "oracle",
    "runner",
    "corpusgen",
    "shared-grammar",
    "semantics",
    "profile-select",
    "workload-freeze",
    "diagnostics",
    "campaign",
    "campaign2",
    "h4diag",
    "horse-a-v2-diag",
    "mechanisms/null-r1",
    "mechanisms/full-rebuild",
    "mechanisms/block-local",
    "mechanisms/fragment-reuse",
    "mechanisms/old-tree-subtree-reuse",
    "mechanisms/restart-convergence",
    "mechanisms/horse-a",
]

# R1 PRIMARY BUILD POLICY (frozen; see manifest/environment.toml and
# protocol/implementation-parity.md).
#
# Ordinary, non-horse-specific policy. No custom allocator, no RUSTFLAGS,
# default target-cpu. Every horse in later rounds is measured under exactly
# this profile.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
incremental = false
panic = "unwind"

# SECOND FROZEN PROFILE (#33 RQ8 optimization-sensitivity check; R0 §4.6).
# Single intentional difference from [profile.release]: thin LTO is
# disabled. Every other field is inherited unchanged (opt-level 3,
# codegen-units 1, incremental false, panic unwind, default target-cpu,
# no RUSTFLAGS, system allocator). Frozen with the toolchain binding in
# manifest/rq8-sensitivity-profile-v1.toml and
# protocol/implementation-parity.md BEFORE any run that relies on it;
# the primary profile above is NOT altered by this addition.
[profile.release-sensitivity-lto-off-v1]
inherits = "release"
lto = false

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
markit-mdbench-common = { path = "common" }
markit-mdbench-instrumentation = { path = "instrumentation" }
markit-mdbench-oracle = { path = "oracle" }
markit-mdbench-null-r1 = { path = "mechanisms/null-r1" }
markit-mdbench-corpusgen = { path = "corpusgen" }
markit-mdbench-shared-grammar = { path = "shared-grammar" }
markit-mdbench-semantics = { path = "semantics" }
markit-mdbench-profile-select = { path = "profile-select" }
markit-mdbench-full-rebuild = { path = "mechanisms/full-rebuild" }
markit-mdbench-block-local = { path = "mechanisms/block-local" }
markit-mdbench-fragment-reuse = { path = "mechanisms/fragment-reuse" }
markit-mdbench-old-tree-subtree-reuse = { path = "mechanisms/old-tree-subtree-reuse" }
markit-mdbench-restart-convergence = { path = "mechanisms/restart-convergence" }
markit-mdbench-horse-a = { path = "mechanisms/horse-a" }
markit-mdbench-runner = { path = "runner" }
markit-mdbench-campaign = { path = "campaign" }
markit-mdbench-campaign2 = { path = "campaign2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
schemars = "1"
toml = "0.8"
# G1 REAL-MARKDOWN lane reference oracle (CORRECTIVE-A §A2). Exact pin, no
# caret range: the lane registry records this version as part of the frozen
# G1 configuration. Only `ENABLE_TABLES` is ever set (see `semantics::lanes`).
pulldown-cmark = { version = "=0.13.4", default-features = false }
