# CORPUS-v1 machine-readable manifest (R3 freeze)
#
# Authority: corpus/CORPUS-v1.md (where they disagree, the .md wins).
# R3 freezes the contract only; `actual_bytes` and `source_sha256` are
# recorded at first generation in corpus/receipt-<corpus_id>.toml and are
# DELIBERATELY absent here (never hand-written).
#
# size labels: 64k = 65536, 1m = 1048576, 16m = 16777216 (UTF-8 bytes,
# exact, no tolerance).

