[package]
name = "markit-mdbench-workload-freeze"
version.workspace = true
edition.workspace = true
license.workspace = true

# CORRECTIVE-C (#35): deterministic real-workload payload freeze.
#
# This crate consumes the frozen CORRECTIVE-B selection, the frozen
# CORRECTIVE-A semantic substrate (lanes / profiler / transition oracle /
# payload lifecycle) and the materialized source bytes, and produces:
#   A6  the complete real-anchor applicability matrix
#   A7  the frozen FULL_READ / EDIT_WRITE / trace manifests
#   the TRANSITION-REGISTRY-v1 artifact and the final coverage report
#   A8  the correctness-only harness dry-run (G7) via the existing runner
#
# It is the only crate that may depend on BOTH `semantics` (workload
# construction) and `mechanisms`/`runner` (correctness-only dispatch).
# The dry-run uses the explicit correctness-only runner mode: it runs no
# clock, collects no work counters, and produces no performance evidence.

[dependencies]
markit-mdbench-common = { workspace = true }
markit-mdbench-oracle = { workspace = true }
markit-mdbench-runner = { path = "../runner" }
markit-mdbench-semantics = { workspace = true }
markit-mdbench-full-rebuild = { workspace = true }
markit-mdbench-block-local = { workspace = true }
markit-mdbench-fragment-reuse = { workspace = true }
markit-mdbench-old-tree-subtree-reuse = { workspace = true }
markit-mdbench-restart-convergence = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[lib]
name = "markit_mdbench_workload_freeze"

[[bin]]
name = "mdbench-corrective-c"
path = "src/bin/mdbench-corrective-c.rs"
