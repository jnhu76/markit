# SEMANTIC_PILOT_SET — P02
#
# G1 table pilot (#35 §4.2 first-class extension): a valid GFM table whose
# delimiter row stops being a delimiter row. The transition is proven by the
# lane oracle: Table -> non-Table, then RESTORE back to the exact original
# bytes.
# Span convention: G1 spans are the oracle's byte ranges, which include the
# final line terminator of a block; G0 spans follow NORMALIZED-RESULT-v1 and
# exclude it. The two conventions are lane-scoped and are never compared
# across lanes.
schema = "semantic-pilot-fixture-v1"
id = "P02"
name = "G1 table delimiter break/restore"
role = "transition"
lanes = ["G1"]
source = '''| a | b |
| --- | --- |
| 1 | 2 |
'''
source_sha256 = "2fd6b622957d919cf19e072ef449c07b9a0579395fd0a840133a026549cce59f"
post_source = '''| a | b |
| abc | --- |
| 1 | 2 |
'''
