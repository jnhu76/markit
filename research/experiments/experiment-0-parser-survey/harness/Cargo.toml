# Research harness for ARCHIVED Experiment 0
# (MARKIT-INCREMENTAL-MARKDOWN-PARSER-SURVEY-1, issue #19 / PR #20).
#
# Research-only archive: not product code, not published, not a workspace
# member of any product build. Everything here measures the public
# markit-core snapshot surface; no parser internals are reached into.
# Historical evidence only; the active research authority is issue #22.
[package]
name = "parser-survey"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
markit-core = { path = "../baseline/markit-core" }
# research-only: spec.json parsing for the ORACLE-B CommonMark battery
serde_json = "1"
# research-only: tree-sitter markdown baseline (RUN-2b). The grammar
# crate tree-sitter-markdown 0.7.1 pins runtime 0.19.5 — both sides must
# share one tree_sitter crate for the Language type to unify.
tree-sitter = "=0.19.5"
tree-sitter-markdown = "0.7.1"

[build-dependencies]
# research-only: compiles the vendored MD4C 0.5.3 baseline sources
cc = "1"
