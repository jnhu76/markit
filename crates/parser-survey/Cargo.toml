# Research harness for issue #19
# (MARKIT-INCREMENTAL-MARKDOWN-PARSER-SURVEY-1).
#
# Research-only: not product code, not published, and must never be
# depended on by markit-core or apps/markit. Everything here measures the
# public markit-core surface; no parser internals are reached into.
[package]
name = "parser-survey"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
markit-core = { path = "../markit-core" }
# research-only: spec.json parsing for the ORACLE-B CommonMark battery
serde_json = "1"
# research-only: tree-sitter markdown baseline (RUN-2b). The grammar
# crate tree-sitter-markdown 0.7.1 pins runtime 0.19.5 — both sides must
# share one tree_sitter crate for the Language type to unify.
tree-sitter = "=0.19.5"
tree-sitter-markdown = "0.7.1"

[build-dependencies]
# research-only: compiles the vendored MD4C 0.5.3 baseline sources
cc = "1"
