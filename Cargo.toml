[workspace]
resolver = "2"
members = ["crates/markit-core", "apps/markit"]

# mvp/gpui is the Phase A0 feasibility prototype. It keeps its own lockfile
# and its prototype-pinned GPUI version; it is not part of the product
# workspace and must not inherit (or define) product dependency decisions.
# The product GPUI baseline is frozen by G0 (docs/product/g0-gpui-baseline.md)
# and consumed only by GPUI-facing crates, never by markit-core.
exclude = ["mvp/gpui"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
markit-core = { path = "crates/markit-core" }

# G0-frozen product GPUI baseline (docs/product/g0-gpui-baseline.md).
# Immutable rev: Zed v1.16.1, commit eb8e1c8b5502b7007465fbbc465f4a736fa39210.
# Never point this at a branch or a moving tag. Changing the rev is a
# dependency migration that must rerun the G0 Windows regression matrix.
# Package names use underscores exactly as declared upstream.
gpui = { git = "https://github.com/zed-industries/zed", rev = "eb8e1c8b5502b7007465fbbc465f4a736fa39210", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "eb8e1c8b5502b7007465fbbc465f4a736fa39210", default-features = false }
